<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Circles — Realtime Rooms</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="layout">
    <section class="stage">
        <canvas id="game" width="1200" height="800" aria-label="Shared game field"></canvas>
    </section>

    <aside class="panel">
        <header>
            <h1>Circles</h1>
            <p class="subtitle">Room-based canvas multiplayer</p>
        </header>

        <div class="room-controls">
            <button id="createRoomBtn" class="primary" type="button">Create room</button>
            <div id="roomRow" class="room-row" hidden>
                <span class="label">Room</span>
                <a id="roomLink" target="_blank" rel="noreferrer"></a>
                <button id="copyRoomBtn" class="ghost" type="button" hidden>Copy link</button>
                <button id="leaveRoomBtn" class="ghost danger" type="button" hidden>Leave</button>
            </div>
        </div>

        <p id="status" class="status">Create a room to start.</p>

        <section>
            <h2>State</h2>
            <pre id="stats">No game state yet.</pre>
        </section>

        <section class="help">
            <h2>Controls</h2>
            <p>
                Move your circle with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
                or the arrow keys. Share the room link to let other players join the same
                rectangular field.
            </p>
        </section>
    </aside>
</main>

<script src="/websocket.js"></script>
<script src="/app.js"></script>
</body>
</html>
