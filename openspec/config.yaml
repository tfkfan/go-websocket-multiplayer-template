schema: spec-driven

context: |
  Do not write comments in source or configuration files. This includes inline,
  block, and documentation comments in Go, JavaScript, CSS, HTML, and YAML.
  Keep code and configuration self-explanatory through naming and structure.
  Preserve only machine directives that the toolchain requires, such as
  //go:build, //go:embed, or a shebang, because removing them changes behavior.
